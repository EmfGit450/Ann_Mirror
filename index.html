<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nodal</title>
    <style>
	    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');	   
		  
		  @keyframes fade-in {
		    0% { opacity: 0; transform: translateY(-100%); }
		    25% { opacity: 0; }
		    50% { opacity: 0.75; transform: translateY(-10%); }
		    80% { opacity: 0.9; transform: translateY(-5%); }
		    100% { opacity: 1; transform: translateY(0); }
		  }
		  
		  @keyframes fade-in-up {
		    0% { opacity: 0; transform: translateY(100%); }
		    25% { opacity: 0; }
		    50% { opacity: 0.75; transform: translateY(30%); }
		    80% { opacity: 0.9; transform: translateY(5%); }
		    100% { opacity: 1; transform: translateY(0); }
		  }
		  
		  :root {
		    --color-primary: linear-gradient(-51deg, #DFDFDF, #EFEFEF);
		    --color-accent: #5dddd5f9;
		  }
		  
		  * {
		    -webkit-tap-highlight-color: transparent;
		    outline: none;
		    box-sizing: border-box;
		  }
	    body {
		    background: black;
		    padding: 32px;
	    }
	    
	    .main-c {
	      padding: 4rem;
	      height: 79vh;
	      background: linear-gradient(-51deg, #030303, #090909);
	      border-radius: 1.5rem;
	      box-shadow: 0.1rem 0.1rem 1rem #121212;
	      
	      font-family: "Jetbrains Mono", Monospace;
		    color: white;
	    }
	    
	    header {
		    user-select: none;
		    
		    animation-name: fade-in;
		    animation-duration: 2s;
		    
		    display: flex;
		    justify-content: center;
		    align-items: center;
		   
		    transition: 0.3s ease-in-out;
		    padding: 2rem;
		    padding-bottom: 2rem;
		    text-shadow: 0 0 1rem #E6E6E6DD;
	    }
	    header span {
	      font-size: 15rem;
	      letter-spacing: 3.5rem;
	    }
	    
	    nav {
	      display: flex;
	      flex-direction: column;
	      align-items: center;
	      gap: 2.5rem;
	    }
	    
	    nav a {
		    user-select: none;
		    text-decoration: none;
		    
		    animation-name: fade-in;
		    animation-duration: 2s;
		    
		    transition: 0.3s;
		    box-shadow: 0 0 1rem #111111;
		    background: linear-gradient(51deg, #070707, #080808);
		    width: 23rem;
		    text-align: center;
		    color: white;
		    padding: 1.4rem;
		    border-radius: 1rem;
		    font-size: 5.9rem;
	    }
	    nav a:last-child {
	      animation-name: fade-in-up;
	    }
	    nav a:hover, a:active {
		    transition: 0.3s ease-in-out;
		    background: linear-gradient(51deg, #BBBBBB, #EFEFEF);
		    box-shadow: 0 0 1rem #D1D1D1;
		    color: black;
		    font-size: 6rem;
		  }
	    
	    @media (max-width: 1320px), (max-height: 1000px) {
	      .main-c {
	        height: 90vh;
	      }
	      
	      header {
	        margin-bottom: 3rem;
	        margin-left: 1rem;
	      }
	      header span {
	        font-size: 7.2rem;
	        letter-spacing: 1.8rem;
	      }
	      
	      nav a {
	        font-size: 3rem;
	      }
	      nav a:hover, a:active {
	        font-size: 3.1rem;
	      }
	      
	    }
    </style>
  </head>
  <!-- resolution below 1320 x 1000 requires adjustment -->
  <body>
	 <div class="main-c"> 
         <header>
           <span>Nodal</span>
         </header>
         <nav>
             <a target="_blank" href="Nodal/main.html">Editor</a>
             <a target="_blank" href="https://gitlab.com/EmfGit450/nodal">Code</a>
         </nav>
	 </div>
  </body>
</html>
