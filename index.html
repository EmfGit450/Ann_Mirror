<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nodal</title>
    <style>
	    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');	   
		  
		  @keyframes fade-in {
		    0% { opacity: 0; transform: translateY(-100%); }
		    25% { opacity: 0; }
		    50% { opacity: 0.75; transform: translateY(-10%); }
		    80% { opacity: 0.9; transform: translateY(-5%); }
		    100% { opacity: 1; transform: translateY(0); }
		  }
		  
		  @keyframes fade-in-up {
		    0% { opacity: 0; transform: translateY(100%); }
		    25% { opacity: 0; }
		    50% { opacity: 0.75; transform: translateY(30%); }
		    80% { opacity: 0.9; transform: translateY(5%); }
		    100% { opacity: 1; transform: translateY(0); }
		  }
		  
		  * {
		    -webkit-tap-highlight-color: transparent;
		    outline: none;
		    box-sizing: border-box;
		  }
		  
		  html, body {
		    margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
		  }
	    body {
		    background: black;
		    padding: 4rem;
		    font-family: "Jetbrains Mono", Monospace;
		    color: white;
	    }
	    
	    header {
	      text-shadow: 0 0 1rem #ffffff59;
	      font-size: 4.2rem;
	    }
	    p {
	      text-shadow: 0 0 1rem #ffffff59;
	      font-size: 2.4rem;
	    }
	    
	    nav {
	      display: flex;
	      flex-direction: column;
	      align-items: flex-start;
	      gap: 2.5rem;
	    }
	    
	    nav a {
		    user-select: none;
		    text-decoration: none;
		    
		    animation-name: fade-in;
		    animation-duration: 2s;
		    
		    transition: 0.3s;
		    box-shadow: 0 0 1rem #111111;
		    background: linear-gradient(51deg, #070707, #080808);
		    color: white;
		    width: 16rem;
		    padding: 1.4rem;
		    border-radius: 1rem;
		    font-size: 2.5rem;
	    }
	    nav a:last-child {
	      animation-name: fade-in-up;
	    }
	    nav a:hover, a:active {
		    transition: 0.3s ease-in-out;
		    background: linear-gradient(51deg, #BBBBBB, #EFEFEF);
		    box-shadow: 0 0 1rem #D1D1D1;
		    color: black;
		    transform: scale(1.04);
		  }
    </style>
  </head>
  <!-- resolution below 1320 x 1000 requires adjustment -->
  <body>
    <header>Ann</header>
    <p>A tool to create, train, infer, and inspect multi-layer perceptrons visually.</p>
    <nav>
      <a target="_blank" href="editor.html">Editor</a>
      <a target="_blank" href="https://gitlab.com/EmfGit450/nodal">Code</a>
    </nav>
  </body>
</html>
