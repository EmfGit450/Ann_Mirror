<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ann</title>
    <style>
	    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
		  
		  @keyframes fade-in {
		    0% { opacity: 0; transform: translateY(-30%); }
		    25% { opacity: 0; }
		    50% { opacity: 0.75; }
		    80% { opacity: 0.9; }
		    100% { opacity: 1; }
		  }
		  
		  @keyframes fade-in-up {
		    0% { opacity: 0; transform: translateY(30%); }
		    25% { opacity: 0; }
		    50% { opacity: 0.75; }
		    80% { opacity: 0.9; }
		    100% { opacity: 1; transform: translateY(0); }
		  }
		  
		  @keyframes fade-in-left {
		    0% { opacity: 0; transform: translateX(-10%); }
		    25% { opacity: 0; }
		    50% { opacity: 0.1; }
		    80% { opacity: 0.9; }
		    100% { opacity: 1; transform: translateX(0); }
		  }
		  
		  * {
		    -webkit-tap-highlight-color: transparent;
		    outline: none;
		    box-sizing: border-box;
		  }
		  
		html, body {
		    margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
		}
	    body {
		    background: black;
		    padding: 4rem;
		    font-family: "Montserrat", Monospace;
		    color: white;
	    }
	    
	    header {
	      text-shadow: 0 0 1rem #ffffff59;
	      font-size: 4.2rem;
	      animation-name: fade-in;
	      animation-duration: 1.2s;
	    }
	    p {
	      text-shadow: 0 0 1rem #ffffff59;
	      font-size: 2.4rem;
	      animation: fade-in-left 1s ease-out;
	    }
	    
	    nav {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
		  column-gap: 0.5rem;
          row-gap: 2rem;
          justify-items: center;
          align-items: center;
        }
		.main-links {
		  margin-top: 2rem;
		}
	    
	    nav a {
		  user-select: none;
		  text-decoration: none;
		  
		  animation-name: fade-in;
		  animation-duration: 1.3s;
		  
		  transition: 0.3s;
		  box-shadow: 0 0 1rem #111111;
		  background: linear-gradient(51deg, #090909, #151515);
		  color: white;
		  width: 100%;
		  max-width: 24rem;
		  padding: 1.1rem;
		  border-radius: 1rem;
		  font-size: 2.5rem;
	    }
	    nav a:nth-child(3), a:nth-child(4) {
	      animation-name: fade-in-up;
	    }
	    nav a:hover, a:active {
		  transition: 0.3s ease-in-out;
		  background: linear-gradient(51deg, #BBBBBB, #EFEFEF);
		  box-shadow: 0 0 1rem #D1D1D1;
		  color: black;
		  transform: scale(1.04);
		}

		@media (max-width: 940px) {
          nav a {
			font-size: 1.9rem;
		    max-width: 17rem;
	      }
		  p {
		    font-size: 2rem;
		  }
        }
    </style>
  </head>
  <!-- resolution below 1320 x 1000 requires adjustment -->
  <body>
    <header>Ann</header>
    <p>A tool to create, train, infer, and inspect multi-layer perceptrons visually.</p>
    <nav class="main-links">
      <a target="_blank" href="editor.html">Editor</a>
      <a target="_blank" href="https://gitlab.com/EmfGit450/ann">Code</a>
	  <a target="_blank" href="docs.html">Documentation</a>
      <a target="_blank" href="dev.html">Development</a>
    </nav>
  </body>
</html>
