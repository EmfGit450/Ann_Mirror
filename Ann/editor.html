<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    
    <link rel="stylesheet" href="css/editor.css" />
    <link rel="stylesheet" href="css/debugger.css" />
    <link rel="stylesheet" href="css/builder.css" />
    <link rel="stylesheet" href="css/settings.css" />
  </head>
  <body>
    <div class="small-screen-error">
      <!-- Modified - from feathericons.com -->
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#FFF"
        stroke-width="0.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="feather feather-smartphone"
      >
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
        <line x1="12" y1="18" x2="12.01" y2="18" />
      </svg>

      <span>The screen size of this device is insufficient to display this content properly</span>
    </div>

    <div class="settings-menu-panel"></div>
    <div class="settings-menu-notch panel-notch">
      <button id="app-settings">
        <!-- path from feathericons.com -->
        <svg class="settings-icon-svg" viewBox="0 0 24 24">
          <circle r="4" cx="12" cy="12" fill="none" stroke="black" stroke-width="2" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
            fill="none"
            stroke-width="2"
            stroke="black"
          />
        </svg>
      </button>
    </div>

    <div class="builder-panel">
      <div class="build-actions-list">
        <div class="creator-panel-section">
          <label class="heading">Create</label>
          <div class="creation-menu builder-panel-section">
            <button id="create-layer">
              <svg viewBox="0 0 32 32">
                <path
                  d="M 5 5 A 2.5 2.5 0 1 0 0 5 A 2.5 2.5 0 1 0 5 5
                     M 10.5 4 A 2.5 2.5 0 1 0 5.5 4 A 2.5 2.5 0 1 0 10.5 4
                     M 16 3 A 2.5 2.5 0 1 0 11 3 A 2.5 2.5 0 1 0 16 3
                     M 21.5 2 A 2.5 2.5 0 1 0 16.5 2 A 2.5 2.5 0 1 0 21.5 2
                     M 5 10.5 A 2.5 2.5 0 1 0 0 10.5 A 2.5 2.5 0 1 0 5 10.5
                     M 10.5 9.5 A 2.5 2.5 0 1 0 5.5 9.5 A 2.5 2.5 0 1 0 10.5 9.5
                     M 16 8.5 A 2.5 2.5 0 1 0 11 8.5 A 2.5 2.5 0 1 0 16 8.5
                     M 21.5 7.5 A 2.5 2.5 0 1 0 16.5 7.5 A 2.5 2.5 0 1 0 21.5 7.5
                     M 5 16 A 2.5 2.5 0 1 0 0 16 A 2.5 2.5 0 1 0 5 16
                     M 10.5 15 A 2.5 2.5 0 1 0 5.5 15 A 2.5 2.5 0 1 0 10.5 15
                     M 16 14 A 2.5 2.5 0 1 0 11 14 A 2.5 2.5 0 1 0 16 14
                     M 21.5 13 A 2.5 2.5 0 1 0 16.5 13 A 2.5 2.5 0 1 0 21.5 13
                     M 5 21.5 A 2.5 2.5 0 1 0 0 21.5 A 2.5 2.5 0 1 0 5 21.5
                     M 10.5 20.5 A 2.5 2.5 0 1 0 5.5 20.5 A 2.5 2.5 0 1 0 10.5 20.5
                     M 16 19.5 A 2.5 2.5 0 1 0 11 19.5 A 2.5 2.5 0 1 0 16 19.5
                     M 21.5 18.5 A 2.5 2.5 0 1 0 16.5 18.5 A 2.5 2.5 0 1 0 21.5 18.5"
                  transform-origin="center"
                  transform="translate(6.5, 6) scale(1.25)"
                />
              </svg>
            </button>
            <div class="create-layer-menu">
              <label class="heading">Layer</label>

              <div class="activation-config">
                <label class="sub">Activation</label>
                <!-- Filled in by editor.js -->
              </div>
              
              <div class="shape-config">
                <label class="sub">Shape</label>
                <div class="shape-number-inputs">
                  <!-- Filled in by editor.js -->
                </div>
              </div>
              
              <div class="position-config">
                <label class="sub">Position</label>
                <div class="position-number-inputs">
                  <!-- Filled in by editor.js -->
                </div>
              </div>
              
            </div>
          </div>
        </div>

        <div class="settings-panel-section">
          <label class="heading">Settings</label>
          <div class="settings panel-div">
            <div class="forward-dir">
              <button id="forward-dir-icon">
                <svg
                  viewBox="0 0 24 24"
                  stroke="black"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M 12 12 L 12 5 M 12 12 L 4.2 17.2 M 12 12 L 19.8 17.2 M 12 12 L 5.2 8.1 M 12 12 L 18.8 8.1 M 12 12 L 12 19"
                    fill="none"
                    transform-origin="center"
                    transform="scale(1.2)"
                  />
                </svg>
              </button>
              <div class="forward-dir-options">
                <button id="px-dir">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M 3 12 L 21 12 M 12 3 L 12 21"
                      stroke="#fff"
                      stroke-linecap="round"
                      stroke-width="3"
                    />
                  </svg>
                </button>
                <button id="py-dir">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M 3 12 L 21 12 M 12 3 L 12 21"
                      stroke="#fff"
                      stroke-linecap="round"
                      stroke-width="3"
                    />
                  </svg>
                </button>
                <button id="pz-dir">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M 3 12 L 21 12 M 12 3 L 12 21"
                      stroke="#fff"
                      stroke-linecap="round"
                      stroke-width="3"
                    />
                  </svg>
                </button>
                <button id="nx-dir">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M 4 12 L 20 12"
                      stroke="#fff"
                      stroke-linecap="round"
                      stroke-width="3"
                    />
                  </svg>
                </button>
                <button id="ny-dir">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M 4 12 L 20 12"
                      stroke="#fff"
                      stroke-linecap="round"
                      stroke-width="3"
                    />
                  </svg>
                </button>
                <button id="nz-dir">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M 4 12 L 20 12"
                      stroke="#fff"
                      stroke-linecap="round"
                      stroke-width="3"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="builder-panel-notch panel-notch">
      <button id="builder-panel-toggler">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="black"
          stroke-width="1.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <!-- Modified - path was generated by Deepseek -->
          <path
            d="M 12 5 L 16 7 L 12 9 L 8 7 Z
                      M 16 7 L 16 11 L 12 13 L 12 9 Z
                      M 8 7 L 12 9 L 12 13 L 8 11 Z
                      M 8 11 L 12 13 L 8 15 L 4 13 Z
                      M 12 17 L 12 13 L 8 15 L 8 19 Z
                      M 4 17 L 8 19 L 8 15 L 4 13 Z
                      M 16 11 L 20 13 L 16 15 L 12 13 Z
                      M 20 17 L 20 13 L 16 15 L 16 19 Z
                      M 12 17 L 16 19 L 16 15 L 12 13 Z"
            transform-origin="center"
            transform="scale(1.4, 1.5)"
          />
        </svg>
      </button>
    </div>

    <div class="main-c">
      <div class="top-editor">
        <div id="debugger">
          <div class="debugger-top">
            <div class="performance">
              <div class="label">Performance</div>
              <!-- Values updated by editor.js -->
              <div id="debugger-fps" class="value"></div>
              <div id="debugger-deltaFrameTime" class="value"></div>
            </div>

            <button id="debugger-close-btn">
              <!-- Modified - shrink by Barudak Lier on IconScout[iconscout.com] -->
              <svg enable-background="new 0 0 32 32" viewBox="0 0 32 32">
                <path
                  d="M18.09268 12.75058c.10934.68189.7718 1.20826 1.45618 1.20992 0 0 6.23915 0 6.23915 0 1.96865-.03352 1.97283-2.96501-.00007-2.99901.00007 0-2.61919 0-2.61919 0l7.89193-7.89241c.58574-.58574.58574-1.53514 0-2.12039-.58574-.58574-1.53465-.58574-2.12039 0l-7.89193 7.89193V6.22136c-.03198-1.96805-2.96586-1.97294-2.99901.00007 0-.00007 0 6.23957 0 6.23957C18.06271 12.55742 18.07039 12.65393 18.09268 12.75058zM12.46136 4.72186c-.82785 0-1.49951.67116-1.49951 1.49951v2.61925L3.06993.94869C1.66016-.41771-.42469 1.6472.94959 3.06913.94954 3.06908 8.84146 10.9615 8.84146 10.9615H6.22221c-1.96795.03183-1.97294 2.96597.00007 2.99901-.00007 0 6.23909 0 6.23909 0 .32008-.0024.63198-.11599.88947-.30374.38254-.28355.58459-.72834.61001-1.19577.00003.00001.00003-6.23963.00003-6.23963C13.96087 5.39302 13.28921 4.72186 12.46136 4.72186zM13.91761 19.25838c-.11004-.69488-.77012-1.18987-1.45625-1.21033.00001-.00002-6.23914-.00002-6.23914-.00002-1.96886.03368-1.97269 2.96497.00007 2.99901-.00007 0 2.61919 0 2.61919 0l-7.89193 7.89242c-.58574.58574-.58574 1.53514 0 2.12039.58574.58574 1.53465.58574 2.12039 0l7.89193-7.89193v2.61925c.03191 1.96815 2.96594 1.97282 2.99901-.00007 0 .00007 0-6.23957 0-6.23957C13.94758 19.45124 13.93976 19.35494 13.91761 19.25838zM23.16877 21.04704h2.61925c1.96806-.03177 1.97281-2.96605-.00007-2.99901.00007 0-6.23909 0-6.23909 0-.39021.02996-.78011.15456-1.05177.45031-.29372.27176-.41828.65998-.44772 1.0492-.00002-.00001-.00002 6.23963-.00002 6.23963.03377 1.96893 2.96488 1.97271 2.99901-.00006 0 .00006 0-2.61919 0-2.61919l7.89193 7.89193c.58574.58574 1.53465.58574 2.12039 0 .58574-.58526.58574-1.53465 0-2.12039L23.16877 21.04704z"
                  fill="#000000"
                  transform-origin="center"
                  transform="scale(0.57)"
                />
              </svg>
            </button>
          </div>

          <div class="debugger-body">
            <!-- Values injected by editor.js -->
            <div class="Vendor">
              <div class="label">Vendor</div>
              <div id="debugger-vendor" class="value"></div>
            </div>

            <div class="Renderer">
              <div class="label">Renderer</div>
              <div id="debugger-renderer" class="value"></div>
            </div>

            <div class="API">
              <div class="label">API</div>
              <div id="debugger-api" class="value"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="babylonjs-canvas">
        <canvas id="mainCanvas"></canvas>
      </div>
    </div>

    <script type="module" src="dist/editor.js"></script>

    <script src="//cdn.jsdelivr.net/npm/eruda"></script>
    <script>
      eruda.init();
    </script>
  </body>
</html>
