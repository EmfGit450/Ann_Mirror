<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Editor</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    
	<link rel="stylesheet" href="editor.css"/>
  </head>
  <body>
   <div id="general-modal">
     Multilayer Perceptrons. yes this is incomplete work
   </div>
     <div class="small-screen-error">
	    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" class="feather feather-smartphone">
			<rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
			<line x1="12" y1="18" x2="12.01" y2="18"/>
		</svg>

		<span>The screen size of this device is insufficient to display this content properly</span>
	 </div>
	 < class="main-c">
		 <div class="top-editor">
		     <button id="code-editor">
		        <svg viewBox="0 0 24 24">
		           <path d="M 2 6 L 9 13 M 9 13 L 2 20" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform-origin="50% 50%" transform="rotate(180) translate(13.5, -2)"/>
		           <path d="M 2 6 L 9 13 M 9 13 L 2 20" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(13.5, 0)"/>
		        </svg>
		     </button>

         <div id="debugger">
           <div class="debugger-top">
             <div class="performance">
               <div class="label">Performance</div>
               <!-- Values updated by editor.js -->
               <div id="debugger-fps" class="value"></div>
               <div id="debugger-deltaFrameTime" class="value"></div>
             </div>
      
             <button id="debugger-close-btn">×</button>
           </div>

           <div class="debugger-body">
             <!-- Values injected by editor.js -->
             <div class="Vendor">
               <div class="label">Vendor</div>
               <div id="debugger-vendor" class="value"></div>
             </div>
      
             <div class="Renderer">
               <div class="label">Renderer</div>
               <div id="debugger-renderer" class="value"></div>
             </div>
      
             <div class="API">
               <div class="label">API</div>
               <div id="debugger-api" class="value"></div>
             </div>
           </div>
   			 </div>

		     <button id="editor-settings"> <!-- path from feathericons.com -->
		        <svg class="settings-icon-svg" viewBox="0 0 24 24">
		           <circle r="4" cx="12" cy="12" fill="none" stroke="black" stroke-width="2"/>
		           <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke-width="2" stroke="black" />
		        </svg>
		     </button>
		 </div>
         
		 <div class="babylonjs-canvas">
		   <canvas id="mainCanvas"></canvas>
		 </div>
		   
	 </div>
	 
   <script type="module" src="dist/editor.js"></script>

  </body>
</html>
