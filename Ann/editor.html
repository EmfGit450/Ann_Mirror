<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/editor.css" />
    <link rel="stylesheet" href="css/debugger.css" />
    <link rel="stylesheet" href="css/builder.css" />
    <link rel="stylesheet" href="css/settings.css" />
    <link rel="stylesheet" href="css/ui-components.css" />
  </head>
  <body>
    <div class="small-screen-error">
      <!-- Modified - from feathericons.com -->
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#FFF"
        stroke-width="0.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="feather feather-smartphone"
      >
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
        <line x1="12" y1="18" x2="12.01" y2="18" />
      </svg>

      <span>Reorient your device or use a larger screen</span>
    </div>

    <div class="settings-menu-panel"></div>
    <div class="settings-menu-notch panel-notch">
      <button id="app-settings">
        <!-- path from feathericons.com -->
        <svg class="settings-icon-svg" viewBox="0 0 24 24">
          <circle r="4" cx="12" cy="12" fill="none" stroke="black" stroke-width="2" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
            fill="none"
            stroke-width="2"
            stroke="black"
          />
        </svg>
      </button>
    </div>

    <div class="builder-panel">
      <div class="build-actions-list">
        <div class="creator-panel-section">
          <label class="heading">Create</label>
          <div class="creation-menu builder-panel-section">
            <button id="create-layer">
              <svg viewBox="0 0 32 32">
                <path
                  d="M 5 5 A 2.5 2.5 0 1 0 0 5 A 2.5 2.5 0 1 0 5 5
                     M 10.5 4 A 2.5 2.5 0 1 0 5.5 4 A 2.5 2.5 0 1 0 10.5 4
                     M 16 3 A 2.5 2.5 0 1 0 11 3 A 2.5 2.5 0 1 0 16 3
                     M 21.5 2 A 2.5 2.5 0 1 0 16.5 2 A 2.5 2.5 0 1 0 21.5 2
                     M 5 10.5 A 2.5 2.5 0 1 0 0 10.5 A 2.5 2.5 0 1 0 5 10.5
                     M 10.5 9.5 A 2.5 2.5 0 1 0 5.5 9.5 A 2.5 2.5 0 1 0 10.5 9.5
                     M 16 8.5 A 2.5 2.5 0 1 0 11 8.5 A 2.5 2.5 0 1 0 16 8.5
                     M 21.5 7.5 A 2.5 2.5 0 1 0 16.5 7.5 A 2.5 2.5 0 1 0 21.5 7.5
                     M 5 16 A 2.5 2.5 0 1 0 0 16 A 2.5 2.5 0 1 0 5 16
                     M 10.5 15 A 2.5 2.5 0 1 0 5.5 15 A 2.5 2.5 0 1 0 10.5 15
                     M 16 14 A 2.5 2.5 0 1 0 11 14 A 2.5 2.5 0 1 0 16 14
                     M 21.5 13 A 2.5 2.5 0 1 0 16.5 13 A 2.5 2.5 0 1 0 21.5 13
                     M 5 21.5 A 2.5 2.5 0 1 0 0 21.5 A 2.5 2.5 0 1 0 5 21.5
                     M 10.5 20.5 A 2.5 2.5 0 1 0 5.5 20.5 A 2.5 2.5 0 1 0 10.5 20.5
                     M 16 19.5 A 2.5 2.5 0 1 0 11 19.5 A 2.5 2.5 0 1 0 16 19.5
                     M 21.5 18.5 A 2.5 2.5 0 1 0 16.5 18.5 A 2.5 2.5 0 1 0 21.5 18.5"
                  transform-origin="center"
                  transform="translate(6.5, 6) scale(1.25)"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="settings-panel-section">
          <label class="heading">Settings</label>
          <div class="settings panel-div">
            <div class="forward-dir">
              <button id="forward-dir-icon">
                <svg
                  viewBox="0 0 24 24"
                  stroke="black"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M 12 12 L 12 5 M 12 12 L 4.2 17.2 M 12 12 L 19.8 17.2 M 12 12 L 5.2 8.1 M 12 12 L 18.8 8.1 M 12 12 L 12 19"
                    fill="none"
                    transform-origin="center"
                    transform="scale(1.2)"
                  />
                </svg>
              </button>
              <div class="forward-dir-options">
                <button id="px-dir">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M 3 12 L 21 12 M 12 3 L 12 21"
                      stroke="#fff"
                      stroke-linecap="round"
                      stroke-width="3"
                    />
                  </svg>
                </button>
                <button id="py-dir">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M 3 12 L 21 12 M 12 3 L 12 21"
                      stroke="#fff"
                      stroke-linecap="round"
                      stroke-width="3"
                    />
                  </svg>
                </button>
                <button id="pz-dir">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M 3 12 L 21 12 M 12 3 L 12 21"
                      stroke="#fff"
                      stroke-linecap="round"
                      stroke-width="3"
                    />
                  </svg>
                </button>
                <button id="nx-dir">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M 4 12 L 20 12"
                      stroke="#fff"
                      stroke-linecap="round"
                      stroke-width="3"
                    />
                  </svg>
                </button>
                <button id="ny-dir">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M 4 12 L 20 12"
                      stroke="#fff"
                      stroke-linecap="round"
                      stroke-width="3"
                    />
                  </svg>
                </button>
                <button id="nz-dir">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M 4 12 L 20 12"
                      stroke="#fff"
                      stroke-linecap="round"
                      stroke-width="3"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="builder-panel-notch panel-notch">
      <button id="builder-panel-toggler">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="black"
          stroke-width="1.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <!-- Modified - path was generated by Deepseek -->
          <path
            d="M 12 5 L 16 7 L 12 9 L 8 7 Z
                      M 16 7 L 16 11 L 12 13 L 12 9 Z
                      M 8 7 L 12 9 L 12 13 L 8 11 Z
                      M 8 11 L 12 13 L 8 15 L 4 13 Z
                      M 12 17 L 12 13 L 8 15 L 8 19 Z
                      M 4 17 L 8 19 L 8 15 L 4 13 Z
                      M 16 11 L 20 13 L 16 15 L 12 13 Z
                      M 20 17 L 20 13 L 16 15 L 16 19 Z
                      M 12 17 L 16 19 L 16 15 L 12 13 Z"
            transform-origin="center"
            transform="scale(1.4, 1.5)"
          />
        </svg>
      </button>
    </div>

    <div class="create-layer-menu" style="display: none;">
      <div class="activation-config">
        <label class="sub">Activation</label>
        <!-- Filled in by editor.js -->
      </div>

      <div class="shape-config">
        <label class="sub">Shape</label>
        <div class="shape-number-inputs">
          <!-- Filled in by editor.js -->
        </div>
      </div>
    </div>

    <div class="main-c">
      <div class="debugger"></div>

      <div class="babylonjs-canvas">
        <canvas id="mainCanvas"></canvas>
      </div>
    </div>

    <script type="module" src="dist/editor.js"></script>

    <script src="//cdn.jsdelivr.net/npm/eruda"></script>
    <script>
      eruda.init();
    </script>
  </body>
</html>
