<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabylonJS WebGPU Cube</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style> 
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <script type="module">
        import * as BABYLON from "./node_modules/@babylonjs/core";
        
        const canvas = document.getElementById("renderCanvas");
        
        // Create WebGPU engine
        const engine = new BABYLON.WebGPUEngine(canvas);
        
        engine.initAsync().then(() => {
            // Create scene
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            
            // Create camera
            const camera = new BABYLON.ArcRotateCamera(
                "camera",
                Math.PI / 4,
                Math.PI / 3,
                8,
                new BABYLON.Vector3(0, 0, 0),
                scene
            );
            camera.attachControl(canvas, true);
            
            // Create light
            const light = new BABYLON.HemisphericLight(
                "light",
                new BABYLON.Vector3(1, 1, 1),
                scene
            );
            light.intensity = 1.2;
            
            // Create white material
            const whiteMaterial = new BABYLON.StandardMaterial("white", scene);
            whiteMaterial.diffuse = new BABYLON.Color3(1, 1, 1);
            
            // Create cube at 0,0,0
            const cube = BABYLON.MeshBuilder.CreateBox("cube", { size: 1 }, scene);
            cube.position = new BABYLON.Vector3(0, 0, 0);
            cube.material = whiteMaterial;
            
            // Render loop
            engine.runRenderLoop(() => {
                scene.render();
            });
            
            // Resize handler
            window.addEventListener("resize", () => {
                engine.resize();
            });
        }).catch(err => {
            console.error("WebGPU initialization failed:", err);
            alert("WebGPU is not supported in your browser. Try Chrome/Edge on a compatible device.");
        });
    </script>
</body>
</html>
