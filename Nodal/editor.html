<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Editor</title>
    <link rel="stylesheet" href="editor.css"/>
  </head>
  <!-- resolution below 445 x 730 requires adjustment -->
  <body>
   <div class="loading-screen">
     <svg viewbox="0 0 100 100" fill="#030303" stroke="#FFF" stroke-width="1">
       <line class="loadline" x1="20" y1="20" x2="45" y2="32.5" opacity="0.8"/>
       <line class="loadline" x1="20" y1="20" x2="45" y2="57.5" opacity="0.8"/>
  
       <line class="loadline" x1="20" y1="45" x2="45" y2="32.5" opacity="0.8"/>
       <line class="loadline" x1="20" y1="45" x2="45" y2="57.5" opacity="0.8"/>
  
       <line class="loadline" x1="20" y1="70" x2="45" y2="32.5" opacity="0.8"/>
       <line class="loadline" x1="20" y1="70" x2="45" y2="57.5" opacity="0.8"/>

       <line class="loadline" x1="45" y1="32.5" x2="70" y2="20" opacity="0.8"/>
       <line class="loadline" x1="45" y1="32.5" x2="70" y2="45" opacity="0.8"/>
       <line class="loadline" x1="45" y1="32.5" x2="70" y2="70" opacity="0.8"/>
  
       <line class="loadline" x1="45" y1="57.5" x2="70" y2="20" opacity="0.8"/>
       <line class="loadline" x1="45" y1="57.5" x2="70" y2="45" opacity="0.8"/>
       <line class="loadline" x1="45" y1="57.5" x2="70" y2="70" opacity="0.8"/>
       
       
       <circle class="loadcirc" cx="20" cy="20" r="8"/>
       <circle class="loadcirc" cx="20" cy="45" r="8"/>
       <circle class="loadcirc" cx="20" cy="70" r="8"/>
       
       <circle class="loadcirc" cx="45" cy="32.5" r="8"/>
       <circle class="loadcirc" cx="45" cy="57.5" r="8"/>
       
       <circle class="loadcirc" cx="70" cy="20" r="8"/>
       <circle class="loadcirc" cx="70" cy="45" r="8"/>
       <circle class="loadcirc" cx="70" cy="70" r="8"/>
     </svg>
   </div>
   <div class="coding-panel">
     
   </div>
	 <div class="main-c">
		 <div class="top-editor-btns">
		     <button id="code-editor">
		        <svg viewBox="0 0 24 24">
		           <path d="M 2 6 L 9 13 M 9 13 L 2 20" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
		           <path class="blink-cursor" d="M 12 21 L 21 21" stroke="black" stroke-width="3" stroke-linecap="round"/>
		        </svg>
		     </button>
		     <button id="editor-settings"> <!-- path from feathericons.com -->
		        <svg class="settings-icon-svg" viewBox="0 0 24 24">
		           <circle r="4" cx="12" cy="12" fill="none" stroke="black" stroke-width="2"/>
		           <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke-width="2" stroke="black" />
		        </svg>
		     </button>
		 </div>
		 
		 <div class="center-editor">
		   <div class="neuron-btns">
		     <button id="add-node">
           <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round">
             <circle r="6" cx="10" cy="10"/>
             <path d="M 12 3 L 12 21 M 3 12 L 21 12" transform="scale(0.3) translate(47, 47)" stroke-width="4"/>
           </svg>
         </button>
         <button id="delete-node">
           <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round">
             <circle r="6" cx="10" cy="10"/>
             <path d="M 4 12 L 20 12" transform="scale(0.3) translate(50, 50)" stroke-width="5"/>
           </svg>
         </button>
		   </div>
		   
		   <div class="pixi-canvas">
		    
		   </div>
		   
		   <div class="layer-btns">
		     <button id="add-layer">
		       <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round">
		         <rect x="5" y="5" width="10" height="10" rx="2" ry="2"/>
		         <path d="M 12 3 L 12 21 M 3 12 L 21 12" transform="scale(0.3) translate(47, 47)" stroke-width="4"/>
		       </svg>
		     </button>
		     <button id="delete-layer">
		       <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round">
		         <rect x="5" y="5" width="10" height="10" rx="2" ry="2"/>
		         <path d="M 4 12 L 20 12" transform="scale(0.3) translate(47, 47)" stroke-width="4"/>
		       </svg>
		     </button>
		   </div>
		   
		 </div>
		 
		 <div class="bottom-editor">
		   <div class="bottom-left-editor-btns">
		      <button id="connect">
	  	      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="black" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="4" height="16"/>
              <rect x="16" y="4" width="4" height="16"/>
              
              <path stroke-width="1.5" d="M 7 7 L 16 7 M 7 17 L 16 17 M 7 12 L 16 12 M 7 6 L 16 18 M 7 18 L 16 6"/>
            </svg>
	  	    </button>
		      <button id="clear"> <!-- from feathericons.com -->
		        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-trash">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
  		    </button>
		   </div>
		   
	   </div>
	 </div>
	 
	 <!-- <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.19.0/dist/pixi.min.js"></script> -->
	 
	 <script type="importmap">
   {
     "imports": {
       "pixi": "https://cdn.jsdelivr.net/npm/pixi.js@8.19.0/+esm",
       "pixi-multistyle-text": "https://cdn.jsdelivr.net/npm/pixi-multistyle-text@5.0.4/+esm"
     }
   }
   </script>
	 <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
	 
   <script type="module" src="js/editor.js"></script>
  </body>
</html>
