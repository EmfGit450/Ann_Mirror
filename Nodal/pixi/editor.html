<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nodal</title>
    <style>
	    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');	   
		  
		  :root {
		    --color-primary: linear-gradient(-51deg, #DFDFDF, #EFEFEF);
		    --color-accent: #5dddd5f9;
		  }
		  
		  * {
		    -webkit-tap-highlight-color: transparent;
		    outline: none;
		    box-sizing: border-box;
		  }
	    body {
		    background: black;
		    padding: 24px;
	    }
	    
	    .main-c {
	      padding: 2.4rem;
	      height: 79vh;
	      background: linear-gradient(-51deg, #030303, #090909);
	      border-radius: 1.5rem;
	      box-shadow: 0.1rem 0.1rem 1rem #121212;
	      
	      font-family: "Jetbrains Mono", Monospace;
		    color: white;
		    
		    display: flex;
		    flex-direction: column;
	    }
	    
	    button {
	      border: none;
	      border-radius: 1.4rem;
	      background: linear-gradient(102deg, #EEE, #959a9af9);
	      font-size: 2rem;
	      width: 4rem;
	      height: 3rem;
	    }
	    
	    .pixi-canvas {
	      height: 50vh;
	      width: 50vw;
	    }
	    
	    .bottom-editor-btns {
	      display: flex;
	      gap: 0.9rem
	    }
	    
	    @media (max-width: 1320px), (max-height: 1000px) {
	      .main-c {
	        height: 92vh;
	      }
	    }
    </style>
  </head>
  <!-- resolution below 1320 x 1000 requires adjustment -->
  <body>
	  <div class="main-c"> 
      <div class="top-left-editor-btns">
        <button>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-terminal">
            <polyline points="4 18 10 12 4 6" />
            <line x1="12" y1="20" x2="20" y2="20" />
          </svg>
        </button>
      </div>
      
      <div class="pixi-canvas">
        
      </div>
      
      <div class="right-editor-btns">
        
      </div>
      <div class="bottom-editor-btns">
        <button>+</button>
        <button>-</button>
        <button>~</button>
        <button>X</button>
      </div>
	  </div>
  </body>
</html>
